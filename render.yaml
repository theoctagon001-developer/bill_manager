services:
  - type: web
    name: laravel-bills-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan migrate --force; apache2-foreground
    healthCheckPath: /up
